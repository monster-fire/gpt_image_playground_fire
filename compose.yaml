services:
  gpt-image-playground:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "${PORT:-11130}:80"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      APP_ORIGIN: ${APP_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_PROXY_URL: ${API_PROXY_URL:-https://api.openai.com/v1}
      ENABLE_API_PROXY: ${ENABLE_API_PROXY:-true}
      LOCK_API_PROXY: ${LOCK_API_PROXY:-false}
      API_CONFIG_PATH: /config/gpt-image-playground.json
      DATA_DIR: /data
    volumes:
      # NAS Docker 面板中可把这两个宿主路径替换为 NAS 共享目录。
      # API 配置写入 /config/gpt-image-playground.json；会话等服务端状态写入 /data。
      - ./config:/config
      - ./data:/data
    restart: unless-stopped
